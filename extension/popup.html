<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ネットルーティン</title>
  <style>
    :root { --bg: #fff; --fg: #1d232b; --muted: #66707c; --border: #d6d9de; --btn: #f1f3f6; --primary: #2563eb; --bar: #e3e7ee; --ok: #16a34a; --hl: #e8efff; --quiet: #9aa1aa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #181b20; --fg: #e6e9ee; --muted: #9aa3ae; --border: #3a414b; --btn: #2a3038; --primary: #5b8cff; --bar: #2a3038; --ok: #34c46a; --hl: #24324d; --quiet: #8b939c; }
    }
    body { margin: 0; width: 320px; padding: 14px; background: var(--bg); color: var(--fg);
      font: 13px/1.4 system-ui, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .status { margin: 0 0 6px; }
    .muted { color: var(--muted); }
    .meter { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; margin: 6px 0 12px; }
    .meter > div { height: 100%; background: var(--ok); }
    button { font: inherit; color: var(--fg); cursor: pointer; }
    .actions button { width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--btn); }
    .actions button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    .list { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 8px; max-height: 280px; overflow: auto; }
    .list h2 { font-size: 12px; margin: 8px 0 2px; color: var(--muted); display: flex; justify-content: space-between; }
    .row { display: flex; align-items: center; gap: 8px; padding: 1px 4px; border-radius: 6px; }
    .row.current { background: var(--hl); }
    .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border);
      color: #fff; font-size: 10px; font-weight: 700; line-height: 12px; text-align: center; }
    .dot.on { background: var(--ok); border-color: var(--ok); }
    /* 新着なし: グレーの塗りつぶし。未巡回は黒い ✓、巡回済みは白い ✓ */
    .dot.quiet { background: var(--quiet); border-color: var(--quiet); color: #111; }
    .dot.on.quiet { color: #fff; }
    .row button { flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 4px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row button:hover { text-decoration: underline; }
    .row.nonew button { color: var(--muted); }
    .badge { flex: none; font-size: 10px; padding: 2px 5px; border-radius: 4px; color: var(--muted); border: 1px solid var(--border); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>ネットルーティン</h1>
  <p class="status" id="status">読み込み中…</p>
  <p class="muted" id="sub"></p>
  <div class="meter"><div id="meter" style="width:0"></div></div>
  <div class="actions">
    <button class="primary" id="start">巡回を開始</button>
    <button id="focus" hidden>巡回タブを表示</button>
    <button id="panel">サイドパネルで編集（ブラウジングしながら登録）</button>
    <button id="edit">サイトを編集（全画面）</button>
  </div>
  <div class="list" id="list" hidden></div>
  <script src="popup.js"></script>
</body>
</html>
